name: Build RailControl APK

# Control build for the "blank navigation rail on car head units" bug.
#
# The three RailDiag builds (surface control off, Impeller off, Impeller on OpenGLES) all rendered the rail
# correctly, but so did d1, which turned out to be a no-op: io.flutter.embedding.android.EnableSurfaceControl
# already defaults to false in Flutter 3.41.9 (getBoolean(ENABLE_SURFACE_CONTROL, false)), so setting it to
# false changed nothing. Three builds that change three unrelated switches cannot all be the fix, which means
# the rail was not fixed by any of them.
#
# The remaining variable is the source revision: the official 1.18.2 APK is from August, while every test
# build so far was built from the current main (November). This job builds the current main with NO source
# changes at all, so that the two can be told apart:
#
#   control renders the rail -> main already contains the fix (or the A/B builds were otherwise broken)
#   control is blank         -> the fix is in the diagnostics rewrite of home_page.dart
#
# Only arm64-v8a is built, because the 32-bit APK cannot be installed on the affected device.

on:
  workflow_dispatch:
  push:
    branches:
      - diag/control

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build_apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter analyze

      - name: Assert no source change was made
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          # App code must be byte identical to main. This runs before the FOSS stripping, which intentionally
          # rewrites app/lib, and before the build identity edits, which only touch gradle and the manifest.
          if ! git diff --quiet -- app/lib; then
            git diff --stat -- app/lib
            echo "::error::app/lib differs from main, this is not a control build"; exit 1
          fi
          echo "app/lib is identical to main"

      - name: Remove proprietary dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: sh support/scripts/remove_proprietary_dependencies.sh

      # Makes the control build installable next to the official app and the diagnostics builds.
      - name: Apply test build identity
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          sed -i 's|applicationId "org.localsend.localsend_app"|applicationId "org.localsend.localsend_app.railctrl"|' app/android/app/build.gradle
          sed -i 's|android:label="LocalSend"|android:label="LS CONTROL (no change)"|' app/android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId ' app/android/app/build.gradle
          grep -n 'android:label=' app/android/app/src/main/AndroidManifest.xml

      - name: Generate throwaway signing key
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          keytool -genkeypair -v \
            -keystore "$PWD/railctrl.jks" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias railctrl \
            -storepass railctrl123 -keypass railctrl123 \
            -dname "CN=LocalSend RailControl Test, OU=RailControl, O=LocalSend, L=Test, ST=Test, C=DE"
          cat > app/android/key.properties <<EOF
          storePassword=railctrl123
          keyPassword=railctrl123
          keyAlias=railctrl
          storeFile=$PWD/railctrl.jks
          EOF

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi --target-platform android-arm64

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp $APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "apk-out/RailControl-main-arm64-v8a.apk"
          ls -l apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: railcontrol-apk
          path: apk-out/*.apk

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="railcontrol-run-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RailControl build ${{ github.run_number }}" \
            --notes "Control build: the current main, with no source changes at all.

          All three RailDiag builds rendered the rail correctly, but d1 was a no-op, so none of those three
          switches can be the reason. The other difference to the official 1.18.2 APK is the source revision.

          If this build renders the rail, the fix is already in main (or the earlier A/B builds were broken
          in some other way). If it is blank, the fix is in the diagnostics rewrite of home_page.dart." \
            apk-out/*.apk
