name: Build RailProbe APK

# Narrows down the fix for the "blank navigation rail on car head units" bug.
#
# Results so far, all installed on the same device, all built with the official flags:
#
#   official 643 / RailFix A+B / RailControl    unmodified                            rail blank
#   RailNudge                                   setState after the first frame        rail blank
#   B1  diagnostics rewrite, overlay off        rewritten tree, no extra widget        rail blank
#   B3  rail forced to collapsed                original tree, no extra widget         rail blank
#   B2  original tree + one overlay widget      original tree + 1 widget               rail visible
#   C2  same overlay, minimised                 original tree + 1 static widget        rail visible
#   C1  RenderView.markNeedsPaint() once        original tree, no extra widget         rail blank
#
# C1 shows that a plain repaint is not enough: the flag does not reach descendants that own a layer. C2 never
# rebuilds at all and still works, so the effect comes from layer composition: the extra composited child stops
# the ancestors from reusing the cached picture that was recorded without the rail.
#
# This round tests three ways of getting that effect without showing anything, plus the known good arrangement as
# a control:
#
#   d1-rail-layer   the rail gets its own RepaintBoundary
#   d2-body-layer   the whole Scaffold body gets its own RepaintBoundary
#   d3-invisible    an invisible, full size composited child in the content stack
#   d4-control      the visible overlay that already works (sanity check of the harness)
#
# Only arm64-v8a is built, because the 32-bit APK cannot be installed on the affected device.

on:
  workflow_dispatch:
  push:
    branches:
      - diag/probe2

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build_apk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: d1-rail-layer
            suffix: ".railprobe11"
            label: "LS D1 rail layer"
          - variant: d2-body-layer
            suffix: ".railprobe12"
            label: "LS D2 body layer"
          - variant: d3-invisible
            suffix: ".railprobe13"
            label: "LS D3 invisible"
          - variant: d4-control
            suffix: ".railprobe14"
            label: "LS D4 control"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Apply the probe patch
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          python3 support/scripts/railprobe_patch.py ${{ matrix.variant }}
          git diff --stat -- app/lib
          # Fail loudly if the patch did not apply, instead of shipping an unmodified build.
          if ! git diff --quiet -- app/lib/pages/home_page.dart; then
            echo "home_page.dart patched"
          else
            echo "::error::home_page.dart was not patched"; exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter analyze

      - name: Remove proprietary dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Apply test build identity
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          sed -i 's|applicationId "org.localsend.localsend_app"|applicationId "org.localsend.localsend_app'"${{ matrix.suffix }}"'"|' app/android/app/build.gradle
          sed -i 's|android:label="LocalSend"|android:label="${{ matrix.label }}"|' app/android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId ' app/android/app/build.gradle
          grep -n 'android:label=' app/android/app/src/main/AndroidManifest.xml

      - name: Generate throwaway signing key
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          keytool -genkeypair -v \
            -keystore "$PWD/railprobe.jks" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias railprobe \
            -storepass railprobe123 -keypass railprobe123 \
            -dname "CN=LocalSend RailProbe Test, OU=RailProbe, O=LocalSend, L=Test, ST=Test, C=DE"
          cat > app/android/key.properties <<EOF
          storePassword=railprobe123
          keyPassword=railprobe123
          keyAlias=railprobe
          storeFile=$PWD/railprobe.jks
          EOF

      # Same flags as the official build, which reproduces the bug.
      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp $APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "apk-out/RailProbe-${{ matrix.variant }}-arm64-v8a.apk"
          ls -l apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: railprobe-apk-${{ matrix.variant }}
          path: apk-out/*.apk

      - name: Save APK for the release job
        uses: actions/upload-artifact@v6
        with:
          name: release-apk-${{ matrix.variant }}
          path: apk-out/*.apk

  publish:
    needs: build_apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          pattern: release-apk-*
          path: apk-out
          merge-multiple: true

      - name: Publish APKs to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l apk-out
          TAG="railprobe2-run-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RailProbe build ${{ github.run_number }} (layer composition)" \
            --notes "Candidate fixes for the blank navigation rail. C1 in the previous round showed that a plain repaint is not enough, while a static overlay works, so the effect is about layer composition.

          **D1 rail layer** - the rail gets its own RepaintBoundary.
          **D2 body layer** - the whole Scaffold body gets its own RepaintBoundary.
          **D3 invisible** - an invisible, full size composited child in the content stack, nothing visible.
          **D4 control** - the visible overlay that already works.

          Whichever renders the rail without visible side effects is the fix to propose upstream." \
            apk-out/*.apk
