name: Build RailDiag APK

# Builds self-signed diagnostic APKs for the "blank navigation rail on car head units" bug.
# Each variant changes exactly one rendering switch, so the failing layer can be identified on the device.
# Everything is signed with a throwaway key generated in the workflow, so no repository secrets are needed.
# Only arm64-v8a is built, because the 32-bit APKs cannot be installed on the affected device.

on:
  workflow_dispatch:
  push:
    branches:
      - diag/rail

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build_apk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # D1: Android surface compositing path disabled. Suspect: split-screen / hardware overlay compositing.
          - variant: d1-surfacecontrol-off
            suffix: ".raildiag1"
            label: "LS D1 no-surfacecontrol"
            meta_key: "io.flutter.embedding.android.EnableSurfaceControl"
            meta_value: "false"
          # D2: Impeller disabled, back to the Skia renderer. Suspect: Impeller partial paint on the device GPU.
          - variant: d2-impeller-off
            suffix: ".raildiag2"
            label: "LS D2 no-impeller"
            meta_key: "io.flutter.embedding.android.EnableImpeller"
            meta_value: "false"
          # D3: Impeller kept, but on the OpenGLES backend instead of Vulkan. Suspect: Vulkan driver.
          - variant: d3-impeller-gles
            suffix: ".raildiag3"
            label: "LS D3 impeller-gles"
            meta_key: "io.flutter.embedding.android.ImpellerBackend"
            meta_value: "opengles"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      # Runs before the FOSS stripping, which leaves an unused import behind in an unrelated file.
      - name: Analyze
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter analyze

      - name: Remove proprietary dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: sh support/scripts/remove_proprietary_dependencies.sh

      # Makes the diagnostic build installable next to the official app.
      - name: Apply test build identity
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          sed -i 's|applicationId "org.localsend.localsend_app"|applicationId "org.localsend.localsend_app'"${{ matrix.suffix }}"'"|' app/android/app/build.gradle
          sed -i 's|android:label="LocalSend"|android:label="${{ matrix.label }}"|' app/android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId ' app/android/app/build.gradle
          grep -n 'android:label=' app/android/app/src/main/AndroidManifest.xml

      - name: Apply rendering switch
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          META_KEY: ${{ matrix.meta_key }}
          META_VALUE: ${{ matrix.meta_value }}
        run: |
          MANIFEST=app/android/app/src/main/AndroidManifest.xml
          sed -i "s|^    </application>|        <meta-data android:name=\"$META_KEY\" android:value=\"$META_VALUE\" />\n    </application>|" "$MANIFEST"
          grep -n "$META_KEY" "$MANIFEST"

      - name: Generate throwaway signing key
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          keytool -genkeypair -v \
            -keystore "$PWD/raildiag.jks" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias raildiag \
            -storepass raildiag123 -keypass raildiag123 \
            -dname "CN=LocalSend RailDiag Test, OU=RailDiag, O=LocalSend, L=Test, ST=Test, C=DE"
          cat > app/android/key.properties <<EOF
          storePassword=raildiag123
          keyPassword=raildiag123
          keyAlias=raildiag
          storeFile=$PWD/raildiag.jks
          EOF

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi --target-platform android-arm64 --dart-define=localsend.railDiagnostics=true

      - name: Verify the switch is in the manifest
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          APK=app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i "${{ matrix.meta_key }}" || {
            echo "::error::rendering switch missing from the manifest"; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i "railDiagnostics" || true

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp $APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "apk-out/RailDiag-${{ matrix.variant }}-arm64-v8a.apk"
          ls -l apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: raildiag-apk-${{ matrix.variant }}
          path: apk-out/*.apk

      - name: Save APK for the release job
        uses: actions/upload-artifact@v6
        with:
          name: release-apk-${{ matrix.variant }}
          path: apk-out/*.apk

  publish:
    needs: build_apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          pattern: release-apk-*
          path: apk-out
          merge-multiple: true

      - name: Publish APKs to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l apk-out
          TAG="raildiag-run-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RailDiag test build ${{ github.run_number }}" \
            --notes "Self-signed diagnostic builds for the blank navigation rail. They install next to the official app.

          All three contain the same app plus a small panel in the bottom right corner of the content area
          that switches the rail layout at runtime (NEXT). Try the panel in every build before judging it.

          **D1 no-surfacecontrol** - Android surface compositing path disabled.
          **D2 no-impeller** - Impeller disabled, Skia renderer.
          **D3 impeller-gles** - Impeller on the OpenGLES backend instead of Vulkan." \
            apk-out/*.apk
