name: Build RailBisect APK

# Bisects the one remaining unknown for the "blank navigation rail on car head units" bug.
#
# Established by installing builds on the affected device:
#
#   official 643        unmodified main                    rail blank
#   RailFix A/B         unmodified main                    rail blank
#   RailControl         unmodified main, same build flags  rail blank
#   RailNudge            unmodified main + setState after  rail blank
#                       the first frame
#   RailDiag d1/d2/d3   diagnostics rewrite of home_page   rail renders
#
# d1 only set io.flutter.embedding.android.EnableSurfaceControl to false, which is already the default in
# Flutter 3.41.9, so d1 changed nothing at the manifest level and still rendered the rail. RailControl uses the
# same rendering switches and build flags as d1 and is blank. Therefore none of the manifest switches, the
# Flutter version, the build flags or a single late rebuild can be the cause; the difference is in how the
# widget tree is built.
#
# This workflow builds three variants from the same unmodified main, each changing exactly one thing:
#
#   b1-structure    the diagnostics rewrite of home_page.dart, but with the overlay panel disabled
#                   -> separates "the rewritten tree" from "the overlay widget"
#   b2-panel        the original tree, plus the overlay panel inserted into the existing Stack
#                   -> tests whether the overlay alone is what makes the rail appear
#   b3-extended-off the original tree, with the rail forced into its collapsed (icon only) form
#                   -> a layout variant that may itself be usable on the device
#
# Only arm64-v8a is built, because the 32-bit APK cannot be installed on the affected device.

on:
  workflow_dispatch:
  push:
    branches:
      - diag/bisect

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build_apk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: b1-structure
            suffix: ".railbisect1"
            label: "LS B1 structure"
            dart_define: "--dart-define=localsend.railDiagnostics=false"
          - variant: b2-panel
            suffix: ".railbisect2"
            label: "LS B2 panel"
            dart_define: "--dart-define=localsend.railDiagnostics=true"
          - variant: b3-extended-off
            suffix: ".railbisect3"
            label: "LS B3 rail collapsed"
            dart_define: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      # The diagnostics rewrite lives on diag/rail. Reusing it verbatim keeps this a single change: only the
      # overlay panel is switched off, which is a compile time constant.
      - name: Fetch the diagnostics rewrite (b1 only)
        if: matrix.variant == 'b1-structure'
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          git fetch -q origin diag/rail
          git checkout origin/diag/rail -- app/lib/pages/home_page.dart app/lib/util/ui/rail_diagnostics.dart
          grep -c "railDiagnosticsEnabled" app/lib/pages/home_page.dart

      - name: Apply the overlay to the original tree (b2 only)
        if: matrix.variant == 'b2-panel'
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          git fetch -q origin diag/rail
          git checkout origin/diag/rail -- app/lib/util/ui/rail_diagnostics.dart
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path("app/lib/pages/home_page.dart")
          text = path.read_text()

          # Import the overlay.
          anchor = "import 'package:localsend_app/util/native/cross_file_converters.dart';\n"
          assert anchor in text, "import anchor missing"
          text = text.replace(
              anchor,
              anchor + "import 'package:localsend_app/util/ui/rail_diagnostics.dart';\n",
              1,
          )

          # Insert the overlay as the last child of the existing Stack inside the content pane.
          marker = """                        if (_dragAndDropIndicator)
                          Container(
                            width: double.infinity,
                            decoration: BoxDecoration(
                              color: Theme.of(context).scaffoldBackgroundColor,
                            ),
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                const Icon(Icons.file_download, size: 128),
                                const SizedBox(height: 30),
                                Text(t.sendTab.placeItems, style: Theme.of(context).textTheme.titleLarge),
                              ],
                            ),
                          ),
"""
          assert marker in text, "stack marker missing"
          text = text.replace(
              marker,
              marker + "                        if (railDiagnosticsEnabled) const RailDiagPanel(),\n",
              1,
          )
          path.write_text(text)
          print("overlay inserted")
          PY

      - name: Force the collapsed rail (b3 only)
        if: matrix.variant == 'b3-extended-off'
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          sed -i 's|extended: sizingInformation.isDesktop,|extended: false,|' app/lib/pages/home_page.dart
          grep -n 'extended: false' app/lib/pages/home_page.dart

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter analyze

      - name: Remove proprietary dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Apply test build identity
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          sed -i 's|applicationId "org.localsend.localsend_app"|applicationId "org.localsend.localsend_app'"${{ matrix.suffix }}"'"|' app/android/app/build.gradle
          sed -i 's|android:label="LocalSend"|android:label="${{ matrix.label }}"|' app/android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId ' app/android/app/build.gradle
          grep -n 'android:label=' app/android/app/src/main/AndroidManifest.xml

      - name: Generate throwaway signing key
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          keytool -genkeypair -v \
            -keystore "$PWD/railbisect.jks" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias railbisect \
            -storepass railbisect123 -keypass railbisect123 \
            -dname "CN=LocalSend RailBisect Test, OU=RailBisect, O=LocalSend, L=Test, ST=Test, C=DE"
          cat > app/android/key.properties <<EOF
          storePassword=railbisect123
          keyPassword=railbisect123
          keyAlias=railbisect
          storeFile=$PWD/railbisect.jks
          EOF

      # Same flags as the official build, which is known to reproduce the bug.
      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi ${{ matrix.dart_define }}

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp $APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "apk-out/RailBisect-${{ matrix.variant }}-arm64-v8a.apk"
          ls -l apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: railbisect-apk-${{ matrix.variant }}
          path: apk-out/*.apk

      - name: Save APK for the release job
        uses: actions/upload-artifact@v6
        with:
          name: release-apk-${{ matrix.variant }}
          path: apk-out/*.apk

  publish:
    needs: build_apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          pattern: release-apk-*
          path: apk-out
          merge-multiple: true

      - name: Publish APKs to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l apk-out
          TAG="railbisect-run-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RailBisect build ${{ github.run_number }}" \
            --notes "Bisects why the diagnostics build renders the navigation rail while every other build does not.

          **B1 structure** - the diagnostics rewrite of home_page.dart, overlay panel switched off.
          **B2 panel** - the original tree, with only the overlay panel added.
          **B3 rail collapsed** - the original tree, with the rail forced into its icon-only form.

          Reading the result:
          B1 renders            -> the rewritten widget tree is the fix, the overlay is irrelevant.
          B1 blank, B2 renders  -> the overlay widget itself is what makes the rail paint.
          B1 and B2 blank       -> neither; compare B3, which may be a usable layout on its own." \
            apk-out/*.apk
