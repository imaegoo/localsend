name: Build RailNudge APK

# Isolates the one remaining variable for the "blank navigation rail on car head units" bug.
#
# Observed, all installed on the same device:
#
#   official 643 / RailFix A+B / RailControl  -> rail is blank   (Dart code: unmodified main)
#   RailDiag d1 + d2 + d3                     -> rail renders     (Dart code: diagnostics rewrite)
#
# d1 was a no-op at the manifest level (EnableSurfaceControl already defaults to false in Flutter 3.41.9), yet
# it rendered the rail just like d2 and d3. RailControl uses the very same rendering switches and build flags
# as d1 and is still blank. So none of the manifest switches, the Flutter version or the build flags can be the
# cause: the difference is the Dart code.
#
# The suspected mechanism is a first-frame timing problem. The rail is laid out in the first frame, while the
# async bootstrap in `initState` is still running, and nothing requests another paint of that subtree
# afterwards. The diagnostics build rebuilt the whole scaffold on every tap of its overlay, which is why the
# rail showed up there.
#
# This build changes exactly one thing compared with the broken builds: it calls setState once after the first
# frame. If the rail appears, that is the whole fix.

on:
  workflow_dispatch:
  push:
    branches:
      - diag/nudge

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build_apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter analyze

      # Must match the broken builds, so that the setState is the only difference.
      - name: Remove proprietary dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Apply test build identity
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          sed -i 's|applicationId "org.localsend.localsend_app"|applicationId "org.localsend.localsend_app.railnudge"|' app/android/app/build.gradle
          sed -i 's|android:label="LocalSend"|android:label="LS NUDGE"|' app/android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId ' app/android/app/build.gradle
          grep -n 'android:label=' app/android/app/src/main/AndroidManifest.xml

      - name: Generate throwaway signing key
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          keytool -genkeypair -v \
            -keystore "$PWD/railnudge.jks" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias railnudge \
            -storepass railnudge123 -keypass railnudge123 \
            -dname "CN=LocalSend RailNudge Test, OU=RailNudge, O=LocalSend, L=Test, ST=Test, C=DE"
          cat > app/android/key.properties <<EOF
          storePassword=railnudge123
          keyPassword=railnudge123
          keyAlias=railnudge
          storeFile=$PWD/railnudge.jks
          EOF

      # Same flags as the official build, i.e. the configuration that is known to be broken.
      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp $APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "apk-out/RailNudge-arm64-v8a.apk"
          ls -l apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: railnudge-apk
          path: apk-out/*.apk

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="railnudge-run-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RailNudge build ${{ github.run_number }}" \
            --notes "Tests one hypothesis: the navigation rail is laid out in the first frame but never painted again.

          Identical to the builds that show the blank rail (same code base, same build flags, same FOSS
          stripping), except that it calls setState once after the first frame.

          Rail visible -> that single rebuild is the fix.
          Rail still blank -> the fix in the diagnostics build is something else and must be bisected further." \
            apk-out/*.apk
